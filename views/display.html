<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Projection</title>
<link rel="stylesheet" href="/css/presenter.css" />
</head>
<body class="display-body">
  <div id="stage" class="stage blank">
    <div class="stage-bg" id="stage-bg"></div>
    <div class="stage-overlay"></div>
    <div class="stage-content" id="stage-content"></div>
    <div class="stage-label" id="stage-label"></div>
    <div class="standby-screen" id="standby-screen">
      <div class="standby-brand-row">
        <img src="/images/brand/rccg-logo.png" alt="RCCG" class="standby-logo" />
        <img src="/images/brand/yp9-logo.png" alt="YP9" class="standby-logo" />
      </div>
      <div class="standby-title">PECULIAR VOICES</div>
      <div class="standby-subtitle">RCCG Youth Province 9</div>
    </div>
    <div class="corner-watermark" id="corner-watermark">
      <img src="/images/brand/rccg-logo.png" alt="" />
      <img src="/images/brand/yp9-logo.png" alt="" />
    </div>
    <div class="ticker-bar" id="ticker-bar">
      <div class="ticker-text" id="ticker-text"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
